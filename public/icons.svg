<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Authored icon set. One 1.75px stroke on a 24px grid, square caps, no fill.
    Drawn rather than borrowed so start/stop/restart read as board controls.
    No emoji or unicode glyphs anywhere in this interface.
  -->
  <defs>
    <style>
      symbol { stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: miter; fill: none; }
    </style>
  </defs>

  <symbol id="i-start" viewBox="0 0 24 24">
    <path d="M8 5.5 18 12 8 18.5Z"/>
  </symbol>

  <symbol id="i-stop" viewBox="0 0 24 24">
    <rect x="6.5" y="6.5" width="11" height="11"/>
  </symbol>

  <symbol id="i-restart" viewBox="0 0 24 24">
    <path d="M19 12a7 7 0 1 1-2.4-5.3"/>
    <path d="M19 4.5V9h-4.5"/>
  </symbol>

  <symbol id="i-backup" viewBox="0 0 24 24">
    <path d="M4.5 6.5h15v13h-15z"/>
    <path d="M8.5 6.5v5h7v-5"/>
    <path d="M8 15.5h8"/>
  </symbol>

  <symbol id="i-restore" viewBox="0 0 24 24">
    <path d="M5 12a7 7 0 1 0 2.4-5.3"/>
    <path d="M5 4.5V9h4.5"/>
    <path d="M12 8.5V12l2.5 2"/>
  </symbol>

  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 4v10"/>
    <path d="M7.5 10 12 14.5 16.5 10"/>
    <path d="M5 19h14"/>
  </symbol>

  <symbol id="i-update" viewBox="0 0 24 24">
    <path d="M12 20V9"/>
    <path d="M7.5 13.5 12 9l4.5 4.5"/>
    <path d="M5 4.5h14"/>
  </symbol>

  <symbol id="i-settings" viewBox="0 0 24 24">
    <path d="M4 8h16"/>
    <path d="M4 16h16"/>
    <rect x="8.5" y="5.5" width="5" height="5"/>
    <rect x="13.5" y="13.5" width="5" height="5"/>
  </symbol>

  <symbol id="i-players" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="3.25"/>
    <path d="M5.5 19.5c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/>
  </symbol>

  <symbol id="i-warning" viewBox="0 0 24 24">
    <path d="M12 4 21 19.5H3Z"/>
    <path d="M12 10v4.5"/>
    <path d="M12 17.25v.5"/>
  </symbol>
</svg>
